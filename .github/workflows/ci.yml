name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cargo Check
        run: cargo check --verbose
      - name: Cargo Unit Tests (Zero entropy, Benford MAD, digit extraction)
        run: cargo test --no-default-features --verbose

  python-check:
    name: Python Build & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest typer rich numpy safetensors
      - name: Build Native Rust Extension
        run: |
          source venv/bin/activate
          maturin develop
      - name: Run Test Suite (CLI, Entropy, Fuzzer)
        run: |
          source venv/bin/activate
          pytest -v tests/

